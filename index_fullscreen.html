<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Reader - Thư viện trực tuyến</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--text:#18202b;--muted:#687386;--line:#e3e7ee;--accent:#315ee7;--soft:#edf1ff}
[data-theme="dark"]{--bg:#11151c;--panel:#1b222d;--text:#edf1f7;--muted:#a4afbf;--line:#303a49;--accent:#8ba5ff;--soft:#293653}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:750;font-size:19px;letter-spacing:-.4px}.brand span{color:var(--accent)}
button,.file-label{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit}
button:hover,.file-label:hover{border-color:var(--accent)}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px;max-width:1600px;margin:auto;height:calc(100vh - 66px)}
.sidebar,.reader{background:var(--panel);border:1px solid var(--line);border-radius:15px;min-height:0}
.sidebar{padding:18px;display:flex;flex-direction:column}.side-title{font-size:17px;font-weight:700;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
.auth-panel{border:1px solid var(--line);border-radius:11px;padding:12px;margin:12px 0}.auth-panel input{width:100%;margin:5px 0 9px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.auth-actions{display:flex;gap:7px;flex-wrap:wrap}.auth-actions button{font-size:13px;padding:7px 9px}.upload{margin:16px 0 18px}.upload input{display:none}.upload .file-label{display:block;text-align:center;background:var(--soft);border-color:transparent;font-weight:650;color:var(--accent)}
.book-list{overflow:auto;display:flex;flex-direction:column;gap:8px}.book{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.book.active{border-color:var(--accent);background:var(--soft)}.cover{width:38px;height:48px;border-radius:5px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:20px;flex:none}.book-name{font-weight:650;overflow-wrap:anywhere;font-size:13px}.book-meta{font-size:12px;color:var(--muted)}
.empty-list{padding:18px 8px;color:var(--muted);font-size:13px;text-align:center}
.reader{display:flex;flex-direction:column;overflow:hidden}.toolbar{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}.book-title{font-weight:700;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}.toolbar button{padding:7px 10px}.pagebox{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.pagebox input{width:58px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}
.viewer{background:#737982;flex:1;min-height:0;overflow:auto;padding:22px}.pdf-pages{display:flex;flex-direction:column;align-items:center;gap:18px}.pdf-pages canvas{max-width:100%;height:auto;background:white;box-shadow:0 2px 12px #0004}.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:#fff}.welcome-inner{max-width:400px}.welcome h2{margin-bottom:5px}.welcome p{color:#e4e7ec}
.footer{padding:9px 15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}

/* Chế độ đọc toàn màn hình */
body.reader-fullscreen { overflow: hidden; }
body.reader-fullscreen header,
body.reader-fullscreen .sidebar { display: none !important; }
body.reader-fullscreen .layout {
  display: block;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  max-width: none;
  margin: 0;
  padding: 0;
}
body.reader-fullscreen .reader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  border: 0;
  border-radius: 0;
}
body.reader-fullscreen .toolbar { padding: 8px; gap: 6px; }
body.reader-fullscreen .book-title { max-width: 100%; }
body.reader-fullscreen .viewer { padding: 6px; }
body.reader-fullscreen .pdf-pages { gap: 8px; }
body.reader-fullscreen .footer { padding: 6px 10px; }
@media (max-width:760px) {
  body.reader-fullscreen .toolbar { gap: 5px; }
  body.reader-fullscreen .book-title { order: -1; width: 100%; }
  body.reader-fullscreen .toolbar button { padding: 7px 9px; }
}

@media (max-width:760px){.layout{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 66px);padding:10px;gap:12px}.sidebar{min-height:0;max-height:none;height:auto;overflow:visible}.book-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}.book{width:100%;min-width:0}.reader{height:72vh;min-height:480px;width:100%}.book-title{max-width:100%;width:100%;order:-1}.toolbar{gap:6px;flex-wrap:wrap}.footer{font-size:11px}}
</style>
</head>
<body>
<header><div class="brand">PDF <span>Reader</span></div><button id="themeBtn" aria-label="Đổi giao diện">☾ Giao diện tối</button></header>
<main class="layout">
<aside class="sidebar">
  <div class="side-title">Thư viện của tôi</div>
  <div class="muted">Thư viện đồng bộ qua tài khoản Supabase</div>
  <div class="auth-panel">
    <div id="authState" class="muted">Chưa đăng nhập</div>
    <div id="authForm">
      <input id="emailInput" type="email" autocomplete="email" placeholder="Địa chỉ email">
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Mật khẩu (tối thiểu 6 ký tự)">
      <div class="auth-actions"><button class="primary" id="signInBtn">Đăng nhập</button><button id="signUpBtn">Đăng ký</button></div>
    </div>
    <div class="auth-actions" id="signedInActions" hidden><button id="signOutBtn">Đăng xuất</button></div>
  </div>
  <div class="upload"><label class="file-label" for="fileInput">＋ Tải PDF lên thư viện</label><input id="fileInput" type="file" accept="application/pdf,.pdf"></div>
  <div class="book-list" id="bookList"><div class="empty-list">Chưa có sách. Hãy thêm một file PDF để bắt đầu.</div></div>
</aside>
<section class="reader">
  <div class="toolbar">
    <div class="book-title" id="bookTitle">Chưa chọn sách</div>
    <button id="prevBtn" disabled>← Trang trước</button>
    <div class="pagebox"><input id="pageInput" type="number" min="1" value="1" disabled><span id="pageTotal">/ —</span></div>
    <button id="nextBtn" disabled>Trang sau →</button>
    <button id="zoomOut" disabled>−</button><button id="zoomIn" disabled>＋</button>
    <button id="fullscreenBtn" type="button" disabled>⛶ Toàn màn hình</button>
    <button id="removeBtn" disabled>Xóa sách</button>
  </div>
  <div class="viewer" id="viewer"><div class="welcome"><div class="welcome-inner"><h2>Không gian đọc sách</h2><p>Thêm một file PDF từ thiết bị để bắt đầu đọc.</p></div></div></div>
  <div class="footer"><span id="status">Sách của bạn được lưu cục bộ trong trình duyệt.</span><span>PDF Reader</span></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://tldznorbfccxgluqljwt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NQklvTI6JmHJrrzk-STHlA_V0gnsnFF';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const BUCKET = 'books';
const DB_NAME='pdf-reader-library', STORE='books';
let db, books=[], current=null, page=1, zoom=1, pdfDoc=null, renderTask=null, loadingTask=null, pageCount=null, session=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(book){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(book);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function formatSize(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
function setStatus(msg){$('status').textContent=msg}
function authMessage(error){const msg=error?.message||String(error);setStatus(msg);alert(msg)}
function updateAuthUI(){
 const signed=!!session?.user;
 $('authState').textContent=signed?'Đã đăng nhập: '+session.user.email:'Chưa đăng nhập';
 $('authForm').hidden=signed;$('signedInActions').hidden=!signed;
 $('fileInput').disabled=!signed;
 $('fileInput').parentElement.querySelector('label').style.opacity=signed?'1':'.5';
 $('fileInput').parentElement.querySelector('label').style.pointerEvents=signed?'auto':'none';
}
function renderList(){
 const list=$('bookList');list.innerHTML='';
 if(!books.length){list.innerHTML='<div class="empty-list">'+(session?'Chưa có sách trong tài khoản. Hãy tải PDF lên.':'Đăng nhập để xem thư viện sách.')+'</div>';return}
 books.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).forEach(b=>{
  const el=document.createElement('div');el.className='book'+(current?.id===b.id?' active':'');
  const cover=document.createElement('div');cover.className='cover';cover.textContent='▤';
  const info=document.createElement('div');info.style.minWidth='0';
  const name=document.createElement('div');name.className='book-name';name.textContent=b.title;
  const meta=document.createElement('div');meta.className='book-meta';meta.textContent=formatSize(Number(b.file_size)||0)+' · Trang '+(b.current_page||1);
  info.append(name,meta);el.append(cover,info);el.onclick=()=>selectBook(b.id);list.append(el);
 });
}
function updateControls(on){['prevBtn','nextBtn','pageInput','zoomOut','zoomIn','fullscreenBtn','removeBtn'].forEach(id=>$(id).disabled=!on)}

async function loadLibrary() {
  if (!session) {
    books = [];
    current = null;
    renderList();
    updateControls(false);
    setStatus('Chưa có phiên đăng nhập.');
    return;
  }

  setStatus('Đang tải thư viện... UID: ' + session.user.id);

  const { data, error } = await supabase
    .from('books')
    .select('id,user_id,title,file_path,file_size,current_page,created_at')
    .eq('user_id', session.user.id)
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Lỗi tải thư viện:', error);
    setStatus('Lỗi tải thư viện: ' + error.message);
    throw error;
  }

  books = data || [];
  current = null;
  renderList();
  updateControls(false);

  setStatus('Tải thành công: ' + books.length + ' sách. UID: ' + session.user.id);
}

async function showPDF(){
 if(!current)return;
 $('bookTitle').textContent=current.title;
 $('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Đang tải sách…</h2><p>Đang tải PDF từ thư viện trực tuyến.</p></div></div>';
 updateControls(true);renderList();
 try{
  if(renderTask){try{renderTask.cancel()}catch(e){}renderTask=null}
  if(loadingTask){try{await loadingTask.destroy()}catch(e){}}
  const {data:blob,error}=await supabase.storage.from(BUCKET).download(current.file_path);
  if(error)throw error;
  const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  loadingTask=lib.getDocument({data:await blob.arrayBuffer()});
  pdfDoc=await loadingTask.promise;pageCount=pdfDoc.numPages;
  page=Math.min(Math.max(1,page),pageCount);
  $('pageTotal').textContent='/ '+pageCount;$('pageInput').value=page;
  const viewer=$('viewer');viewer.innerHTML='';
  const pages=document.createElement('div');pages.className='pdf-pages';viewer.append(pages);
  const pdfPage=await pdfDoc.getPage(page);const base=pdfPage.getViewport({scale:1});
  const available=Math.max(300,viewer.clientWidth-44);const scale=Math.min(2.5,Math.max(.5,(available/base.width)*zoom));
  const viewport=pdfPage.getViewport({scale});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';pages.append(canvas);
  renderTask=pdfPage.render({canvasContext:ctx,viewport});await renderTask.promise;renderTask=null;
  setStatus('Đang đọc trang '+page+' / '+pageCount+' · Đã đồng bộ thư viện');
  $('prevBtn').disabled=page<=1;$('nextBtn').disabled=page>=pageCount;
 }catch(err){console.error(err);$('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Không mở được PDF</h2><p>Kiểm tra quyền Storage, kết nối Internet hoặc tính hợp lệ của file PDF.</p></div></div>';setStatus('Lỗi tải PDF: '+(err.message||err));}
}
async function selectBook(id){current=books.find(b=>b.id===id);if(!current)return;page=current.current_page||1;zoom=1;await showPDF()}
async function savePage(){
 if(!current||!session)return;const val=Math.max(1,Number($('pageInput').value)||1);page=pageCount?Math.min(val,pageCount):val;
 const {error}=await supabase.from('books').update({current_page:page}).eq('id',current.id).eq('user_id',session.user.id);
 if(error){authMessage(error);return}current.current_page=page;renderList();await showPDF();setStatus('Đã lưu vị trí đọc: trang '+page);
}
$('signInBtn').onclick=async()=>{const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||!password){alert('Nhập email và mật khẩu.');return}const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){authMessage(error);return}session=data.session;updateAuthUI();try{await loadLibrary();setStatus('Đăng nhập thành công.')}catch(e){authMessage(e)}};
$('signUpBtn').onclick=async()=>{const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||password.length<6){alert('Nhập email hợp lệ và mật khẩu tối thiểu 6 ký tự.');return}const {data,error}=await supabase.auth.signUp({email,password});if(error){authMessage(error);return}if(data.session){session=data.session;updateAuthUI();await loadLibrary();setStatus('Đăng ký thành công.')}else{alert('Đã gửi email xác nhận. Hãy mở email để xác nhận tài khoản, sau đó quay lại đăng nhập.');setStatus('Chờ xác nhận email.')}};
$('signOutBtn').onclick=async()=>{const {error}=await supabase.auth.signOut();if(error){authMessage(error);return}session=null;books=[];current=null;updateAuthUI();renderList();updateControls(false);$('bookTitle').textContent='Chưa chọn sách';$('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Không gian đọc sách</h2><p>Đăng nhập để mở thư viện của bạn.</p></div></div>';setStatus('Đã đăng xuất.')};
// Phiên đăng nhập được khôi phục khi mở ứng dụng bằng getSession().
$('fileInput').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 if(!session){alert('Bạn cần đăng nhập trước khi tải sách lên.');e.target.value='';return}
 if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Vui lòng chọn file PDF.');e.target.value='';return}
 if(file.size>50*1024*1024){alert('File vượt quá giới hạn 50 MB của dự án Supabase hiện tại.');e.target.value='';return}
 const path=session.user.id+'/'+crypto.randomUUID()+'_'+file.name.replace(/[\\/]/g,'_');setStatus('Đang tải PDF lên Supabase…');
 try{
  const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:'application/pdf',upsert:false});if(uploadError)throw uploadError;
  const {data:row,error:insertError}=await supabase.from('books').insert({user_id:session.user.id,title:file.name,file_path:path,file_size:file.size,current_page:1}).select().single();
  if(insertError){await supabase.storage.from(BUCKET).remove([path]);throw insertError}
  await loadLibrary();await selectBook(row.id);setStatus('Đã tải '+file.name+' lên thư viện trực tuyến.');
 }catch(err){console.error(err);authMessage(err)}finally{e.target.value=''}
});
$('prevBtn').onclick=async()=>{if(page>1){page--;await saveCurrentPageAndRender()}};
$('nextBtn').onclick=async()=>{if(page<pageCount){page++;await saveCurrentPageAndRender()}};
async function saveCurrentPageAndRender(){if(!current)return;const {error}=await supabase.from('books').update({current_page:page}).eq('id',current.id).eq('user_id',session.user.id);if(error){authMessage(error);return}current.current_page=page;renderList();await showPDF()}
$('pageInput').addEventListener('change',savePage);$('pageInput').addEventListener('keydown',e=>{if(e.key==='Enter')savePage()});
$('zoomIn').onclick=()=>{zoom=Math.min(zoom+.2,2.5);showPDF()};$('zoomOut').onclick=()=>{zoom=Math.max(zoom-.2,.5);showPDF()};
$('removeBtn').onclick=async()=>{if(!current||!session||!confirm('Xóa "'+current.title+'" khỏi thư viện trực tuyến?'))return;const item=current;const {error:storageError}=await supabase.storage.from(BUCKET).remove([item.file_path]);if(storageError){authMessage(storageError);return}const {error}=await supabase.from('books').delete().eq('id',item.id).eq('user_id',session.user.id);if(error){authMessage(error);return}current=null;await loadLibrary();$('bookTitle').textContent='Chưa chọn sách';$('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Không gian đọc sách</h2><p>Chọn một cuốn sách trong thư viện hoặc tải PDF mới.</p></div></div>';$('pageTotal').textContent='/ —';updateControls(false);setStatus('Đã xóa sách.')};
$('fullscreenBtn').onclick=async()=>{
 const entering=!document.body.classList.contains('reader-fullscreen');
 document.body.classList.toggle('reader-fullscreen',entering);
 $('fullscreenBtn').textContent=entering?'⤢ Thu nhỏ':'⛶ Toàn màn hình';
 // Chờ CSS cập nhật kích thước vùng đọc rồi mới render lại PDF.
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 if(current) await showPDF();
};
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeBtn').textContent=dark?'☀ Giao diện sáng':'☾ Giao diện tối';localStorage.setItem('pdf-reader-theme',dark?'dark':'light')};
(async()=>{try{db=await openDB();const {data}=await supabase.auth.getSession();session=data.session;updateAuthUI();if(session)await loadLibrary();else renderList();const saved=localStorage.getItem('pdf-reader-theme');if(saved==='dark'){$('themeBtn').click()}}catch(e){setStatus('Lỗi khởi tạo: '+(e.message||e));}})();
</script>
</body>
</html>
