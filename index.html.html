<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện PDF</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--text:#18202b;--muted:#687386;--line:#e3e7ee;--accent:#315ee7;--soft:#edf1ff}
[data-theme="dark"]{--bg:#11151c;--panel:#1b222d;--text:#edf1f7;--muted:#a4afbf;--line:#303a49;--accent:#8ba5ff;--soft:#293653}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:750;font-size:19px;letter-spacing:-.4px}.brand span{color:var(--accent)}
button,.file-label{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit}
button:hover,.file-label:hover{border-color:var(--accent)}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px;max-width:1600px;margin:auto;height:calc(100vh - 66px)}
.sidebar,.reader{background:var(--panel);border:1px solid var(--line);border-radius:15px;min-height:0}
.sidebar{padding:18px;display:flex;flex-direction:column}.side-title{font-size:17px;font-weight:700;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
.upload{margin:16px 0 18px}.upload input{display:none}.upload .file-label{display:block;text-align:center;background:var(--soft);border-color:transparent;font-weight:650;color:var(--accent)}
.book-list{overflow:auto;display:flex;flex-direction:column;gap:8px}.book{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.book.active{border-color:var(--accent);background:var(--soft)}.cover{width:38px;height:48px;border-radius:5px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:20px;flex:none}.book-name{font-weight:650;overflow-wrap:anywhere;font-size:13px}.book-meta{font-size:12px;color:var(--muted)}
.empty-list{padding:18px 8px;color:var(--muted);font-size:13px;text-align:center}
.reader{display:flex;flex-direction:column;overflow:hidden}.toolbar{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}.book-title{font-weight:700;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}.toolbar button{padding:7px 10px}.pagebox{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.pagebox input{width:58px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}
.viewer{background:#737982;flex:1;min-height:0;overflow:auto;padding:22px}.pdf-pages{display:flex;flex-direction:column;align-items:center;gap:18px}.pdf-pages canvas{max-width:100%;height:auto;background:white;box-shadow:0 2px 12px #0004}.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:#fff}.welcome-inner{max-width:400px}.welcome h2{margin-bottom:5px}.welcome p{color:#e4e7ec}
.footer{padding:9px 15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
@media(max-width:760px){.layout{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 66px);padding:10px;gap:10px}.sidebar{min-height:0;max-height:245px}.book-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.reader{height:72vh;min-height:480px}.book-title{max-width:100%;width:100%;order:-1}.toolbar{gap:6px}.footer{font-size:11px}}
</style>
</head>
<body>
<header><div class="brand">PDF <span>Reader</span></div><button id="themeBtn" aria-label="Đổi giao diện">☾ Giao diện tối</button></header>
<main class="layout">
<aside class="sidebar">
  <div class="side-title">Thư viện của tôi</div>
  <div class="muted">Sách được lưu trên thiết bị này</div>
  <div class="upload"><label class="file-label" for="fileInput">＋ Thêm sách PDF</label><input id="fileInput" type="file" accept="application/pdf,.pdf"></div>
  <div class="book-list" id="bookList"><div class="empty-list">Chưa có sách. Hãy thêm một file PDF để bắt đầu.</div></div>
</aside>
<section class="reader">
  <div class="toolbar">
    <div class="book-title" id="bookTitle">Chưa chọn sách</div>
    <button id="prevBtn" disabled>← Trang trước</button>
    <div class="pagebox"><input id="pageInput" type="number" min="1" value="1" disabled><span id="pageTotal">/ —</span></div>
    <button id="nextBtn" disabled>Trang sau →</button>
    <button id="zoomOut" disabled>−</button><button id="zoomIn" disabled>＋</button>
    <button id="removeBtn" disabled>Xóa sách</button>
  </div>
  <div class="viewer" id="viewer"><div class="welcome"><div class="welcome-inner"><h2>Không gian đọc sách</h2><p>Thêm một file PDF từ thiết bị để bắt đầu đọc.</p></div></div></div>
  <div class="footer"><span id="status">Sách của bạn được lưu cục bộ trong trình duyệt.</span><span>PDF Reader</span></div>
</section>
</main>
<script>
const DB_NAME='pdf-reader-library', STORE='books';
let db, books=[], current=null, page=1, zoom=1, pdfDoc=null, renderTask=null, loadingTask=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((resolve,reject)=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(book){return new Promise((resolve,reject)=>{const r=tx('readwrite').put(book);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{const r=tx('readwrite').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function formatSize(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
function renderList(){
 const list=$('bookList');list.innerHTML='';
 if(!books.length){list.innerHTML='<div class="empty-list">Chưa có sách. Hãy thêm một file PDF để bắt đầu.</div>';return}
 books.sort((a,b)=>b.added-a.added).forEach(b=>{
  const el=document.createElement('div');el.className='book'+(current?.id===b.id?' active':'');
  const cover=document.createElement('div');cover.className='cover';cover.textContent='▤';
  const info=document.createElement('div');info.style.minWidth='0';
  const name=document.createElement('div');name.className='book-name';name.textContent=b.name;
  const meta=document.createElement('div');meta.className='book-meta';meta.textContent=formatSize(b.size)+' · Trang '+(b.lastPage||1);
  info.append(name,meta);el.append(cover,info);el.onclick=()=>selectBook(b.id);list.append(el);
 });
}
function updateControls(on){['prevBtn','nextBtn','pageInput','zoomOut','zoomIn','removeBtn'].forEach(id=>$(id).disabled=!on)}
async function showPDF(){
 if(!current)return;
 $('bookTitle').textContent=current.name;
 $('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Đang tải sách…</h2><p>Đang xử lý file PDF trong trình duyệt.</p></div></div>';
 updateControls(true);renderList();
 try{
  if(renderTask){try{renderTask.cancel()}catch(e){}renderTask=null}
  if(loadingTask){try{await loadingTask.destroy()}catch(e){}}
  const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  loadingTask=lib.getDocument({data:await current.blob.arrayBuffer()});
  pdfDoc=await loadingTask.promise;pageCount=pdfDoc.numPages;
  page=Math.min(Math.max(1,page),pageCount);
  $('pageTotal').textContent='/ '+pageCount;$('pageInput').value=page;
  const viewer=$('viewer');viewer.innerHTML='';
  const pages=document.createElement('div');pages.className='pdf-pages';viewer.append(pages);
  const pdfPage=await pdfDoc.getPage(page);
  const base=pdfPage.getViewport({scale:1});
  const available=Math.max(300,viewer.clientWidth-44);
  const scale=Math.min(2.5,Math.max(.5,(available/base.width)*zoom));
  const viewport=pdfPage.getViewport({scale});
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
  canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';
  pages.append(canvas);
  renderTask=pdfPage.render({canvasContext:ctx,viewport});
  await renderTask.promise;renderTask=null;
  $('status').textContent='Đang đọc trang '+page+' / '+pageCount+' · PDF.js';
  $('prevBtn').disabled=page<=1;$('nextBtn').disabled=page>=pageCount;
 }catch(err){
  console.error(err);
  $('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Không mở được PDF</h2><p id="pdfError">Kiểm tra kết nối Internet rồi tải lại file. Nếu file có mật khẩu hoặc bị hỏng, trình đọc có thể không mở được.</p></div></div>';
  $('status').textContent='Lỗi khi đọc PDF. Thử tải lại hoặc dùng file PDF khác.';
 }
}
async function selectBook(id){
 current=books.find(b=>b.id===id);if(!current)return;
 page=current.lastPage||1;zoom=100;pageCount=null;
 showPDF();$('status').textContent='Đang đọc: '+current.name+' · Vị trí đã lưu: trang '+page;
}
async function savePage(){
 if(!current)return;
 const val=Math.max(1,Number($('pageInput').value)||1);
 page=pageCount?Math.min(val,pageCount):val;current.lastPage=page;await put(current);
 showPDF();$('status').textContent='Đã lưu vị trí đọc: trang '+page;
}
$('fileInput').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Vui lòng chọn file PDF.');return}
 const book={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:file.name,size:file.size,blob:file,lastPage:1,added:Date.now()};
 try{await put(book);books=await getAll();await selectBook(book.id);$('status').textContent='Đã thêm '+file.name+' vào thư viện.'}
 catch(err){alert('Không lưu được file. Có thể file quá lớn hoặc trình duyệt hết dung lượng.')}
 e.target.value='';
});
$('prevBtn').onclick=async()=>{if(page>1){page--;current.lastPage=page;await put(current);await showPDF()}};
$('nextBtn').onclick=async()=>{if(page<pageCount){page++;current.lastPage=page;await put(current);await showPDF()}};
$('pageInput').addEventListener('change',savePage);
$('pageInput').addEventListener('keydown',e=>{if(e.key==='Enter')savePage()});
$('zoomIn').onclick=()=>{zoom=Math.min(zoom+.2,2.5);showPDF()};
$('zoomOut').onclick=()=>{zoom=Math.max(zoom-.2,.5);showPDF()};
$('removeBtn').onclick=async()=>{if(!current||!confirm('Xóa "'+current.name+'" khỏi thư viện?'))return;await del(current.id);current=null;books=await getAll();renderList();$('bookTitle').textContent='Chưa chọn sách';$('viewer').innerHTML='<div class="welcome"><div class="welcome-inner"><h2>Không gian đọc sách</h2><p>Chọn một cuốn sách trong thư viện hoặc thêm file PDF mới.</p></div></div>';$('pageTotal').textContent='/ —';updateControls(false)};
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeBtn').textContent=dark?'☀ Giao diện sáng':'☾ Giao diện tối';localStorage.setItem('pdf-reader-theme',dark?'dark':'light')};
(async()=>{try{db=await openDB();books=await getAll();renderList();const saved=localStorage.getItem('pdf-reader-theme');if(saved==='dark'){$('themeBtn').click()}}catch(e){$('status').textContent='Trình duyệt không hỗ trợ lưu thư viện cục bộ.'}})();
</script>
</body>
</html>
